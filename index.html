        <h1>Farid Sayago — MLOps Engineer</h1>
        <p>MLOps Engineer from Colombia specializing in Python, AWS, Kubernetes, Docker, Terraform, data pipelines, and AI agent orchestration.</p>

        <h2>Projects</h2>
        <h3>wiener-git</h3>
        <p>A Python implementation of Git's core internals — blob, tree, and commit objects — built from scratch to deeply understand version control systems. Covers content-addressable storage, SHA-1 hashing, object serialization, and CLI design patterns.</p>
        <p><a href="https://github.com/faridsz0605/wiener-git">View on GitHub</a></p>

        <h3>WHTTP — HTTP Server in C</h3>
        <p>An HTTP/1.1 server written from scratch in C, handling raw socket I/O, request parsing, and response formatting. Built to gain hands-on mastery of API security primitives — buffer boundaries, header injection, and connection management.</p>
        <p><a href="https://github.com/faridsz0605/whttp">View on GitHub</a></p>

        <h3>Wiener Tickets — ML Ticket Prediction</h3>
        <p>An end-to-end MLOps pipeline for predicting IT support ticket categories using supervised classification models in Python. Implements the full ML lifecycle: data ingestion, feature engineering, model training, experiment tracking, and automated retraining.</p>
        <p><a href="https://github.com/faridsz0605/wiener-tickets">View on GitHub</a></p>
